# agent-fleet REST 契约
#
# 依据：架构 v1.1.2 §8.1（REST API）与 §6.4（错误模型）。
# machines / profiles 为完整 CRUD；skills / providers / deployments 为骨架路由，
# 一律返回 501 NotImplemented（实现归属后续切片）。
# KM-22 新增：POST /api/v1/machines/{name}/enroll-token（一次性 enrollment token）。
# KM-23 新增动作端点：reconcile/confirm、rollback、operations、cancel/skip、
# drift、render、deployment rollback/skip-target（§8.1）。
# 其余动作端点（probe/bootstrap/repair-agentd/inventory）、SSE 与 gRPC 契约
# 不在本文件（gRPC 以 api/proto/fleet/v1 为准；SSH 路径随第 6 片）。
# 声明版本为 3.1.0（KM-21 核查发现 #1：本文件使用了 3.1 才有的
# components.pathItems；3.0.3 声明与内容不符会卡严格校验器）。
openapi: 3.1.0
info:
  title: agent-fleet control plane
  version: 0.1.0
  description: |
    面向单操作者的 Agent 工作站机群管理器控制面。
    资源统一 K8s 风格 `metadata/spec/status` JSON 形态；名称在类型内唯一。
    spec 由操作者读写；status 由控制器维护——创建时初始化为 `{}`，更新时不接受改写。
servers:
  - url: http://127.0.0.1:7788
tags:
  - name: system
  - name: machines
  - name: profiles
  - name: skeleton
paths:
  /healthz:
    get:
      tags: [system]
      summary: 存活探针
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      tags: [system]
      summary: 就绪探针（存储可用性）
      responses:
        "200":
          description: 就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/machines:
    get:
      tags: [machines]
      summary: 列出 Machine（支持 ?name= 过滤）
      parameters:
        - name: name
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Machine 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineList"
    post:
      tags: [machines]
      summary: 创建 Machine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Machine"
      responses:
        "201":
          description: 已创建（服务端补齐 metadata，status 置 {}）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Machine"
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/machines/{name}:
    parameters:
      - $ref: "#/components/parameters/ResourceName"
    get:
      tags: [machines]
      summary: 读取 Machine
      responses:
        "200":
          description: Machine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Machine"
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [machines]
      summary: 更新 Machine spec（metadata 与 status 以存储现值为准）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Machine"
      responses:
        "200":
          description: 更新后的 Machine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Machine"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [machines]
      summary: 删除 Machine
      responses:
        "204":
          description: 已删除
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/profiles:
    get:
      tags: [profiles]
      summary: 列出 AgentProfile（支持 ?name= 过滤）
      parameters:
        - name: name
          in: query
          schema:
            type: string
      responses:
        "200":
          description: AgentProfile 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfileList"
    post:
      tags: [profiles]
      summary: 创建 AgentProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfile"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/profiles/{name}:
    parameters:
      - $ref: "#/components/parameters/ResourceName"
    get:
      tags: [profiles]
      summary: 读取 AgentProfile
      responses:
        "200":
          description: AgentProfile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [profiles]
      summary: 更新 AgentProfile spec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfile"
      responses:
        "200":
          description: 更新后的 AgentProfile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [profiles]
      summary: 删除 AgentProfile
      responses:
        "204":
          description: 已删除
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/machines/{name}/enroll-token:
    post:
      tags: [machines]
      summary: 签发一次性 enrollment token（KM-22）
      description: |
        为既有 Machine 签发 enrollment token（短时效、一次性、熵 ≥128-bit），
        并绑定 machineId 与 CSR 公钥指纹（§4.6）。token 明文仅在响应中出现一次，
        服务端只存 SHA-256 哈希；并发/重放的 enroll 消费在数据库层原子化，
        至多一个请求成功（FR-11.5）。
      parameters:
        - $ref: "#/components/parameters/ResourceName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollTokenRequest"
      responses:
        "201":
          description: 已签发（含一次性明文 token）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollToken"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  # ===== KM-23 动作端点（§8.1）=====

  /api/v1/machines/{name}/reconcile:
    post:
      tags: [machines]
      summary: 触发收敛或确认计划（KM-23）
      description: |
        机器级互斥的派发点获取（§4.3）：以一次事务创建 Pending 操作行，
        该机已有未决操作（Pending/Running/AwaitingConfirmation/CancelRequested/
        Unknown）时返回 409 MachineBusy（diagnostics 携带未决操作引用），不排队。
        携带 confirmPlanDigest 时为互斥三例外之一（§4.3 第 6 条）：确认该操作
        自己的计划并推进执行；digest 与等待中的 planDigest 不一致返回
        409 ReplanRequired（FR-12.7）。
      parameters:
        - $ref: "#/components/parameters/ResourceName"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileRequest"
      responses:
        "202":
          description: 已受理（返回 Operation，客户端凭 id 追踪进度）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/machines/{name}/rollback:
    post:
      tags: [machines]
      summary: 机器级回滚到指定 generation（KM-23，§7.2）
      description: |
        对目标 generation 的快照重放一次 reconcile：先把目标代内容物化为该机
        新期望代（回滚不把机器拉回旧代，FR-7.5/ADR-2），走适配器合并写
        （天然保留未托管字段）。目标代不可解析 → 409 RollbackUnsupported。
      parameters:
        - $ref: "#/components/parameters/ResourceName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetGeneration]
              properties:
                targetGeneration:
                  type: integer
                  format: int64
      responses:
        "202":
          description: 已受理（Rollback 型 Operation）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/machines/{name}/operations:
    get:
      tags: [machines]
      summary: 列出机器的操作审计记录（KM-23）
      parameters:
        - $ref: "#/components/parameters/ResourceName"
      responses:
        "200":
          description: 操作列表（§6.4 不可变审计单元）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Operation"
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/machines/{name}/operations/{opId}/cancel:
    post:
      tags: [machines]
      summary: 取消未决操作（互斥例外端点之一，KM-23）
      description: |
        置 CancelRequested 并投递 CancelOperation；节点不可达时保持
        CancelRequested，服务端不单方面置 Cancelled（FR-13.9）。重复取消幂等。
        AwaitingConfirmation 的计划取消直接终态（节点无可中断流水线，§9.3）。
      parameters:
        - $ref: "#/components/parameters/ResourceName"
        - name: opId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 取消状态（Operation）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/machines/{name}/operations/{opId}/skip:
    post:
      tags: [machines]
      summary: 显式跳过未决操作（互斥例外端点之一，KM-23）
      description: |
        立即释放控制面互斥，terminalModifier=Skipped：不计入成功、必须携带
        reason（审计），UI 显式标出，不允许静默跳过（§9.6 路径 C/FR-15.4）。
        跳过不改变节点实际状态——节点可能仍在写。
      parameters:
        - $ref: "#/components/parameters/ResourceName"
        - name: opId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                operator: { type: string }
      responses:
        "200":
          description: 跳过后的 Operation（Succeeded + Skipped 修饰）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/machines/{name}/drift:
    get:
      tags: [machines]
      summary: drift 三态视图（KM-23，FR-14.5）
      description: |
        一致(False) / 未知或过期(Unknown + reason: NeverInventoried |
        StaleObservation | ObservationPredatesDesired | ProjectionVersionMismatch) /
        漂移(True)。权威判据：期望受管投影摘要 == 观测受管投影摘要 且
        canonicalizationVersion 一致（FR-8.6）。
      parameters:
        - $ref: "#/components/parameters/ResourceName"
      responses:
        "200":
          description: drift 三态与证据
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/profiles/{name}/render:
    get:
      tags: [profiles]
      summary: 渲染期望状态预览（KM-23，FR-7.4）
      parameters:
        - $ref: "#/components/parameters/ResourceName"
        - name: machine
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 归一化期望状态 + 确定性摘要（不落库、不增代）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/deployments/{name}/rollback:
    post:
      tags: [machines]
      summary: 创建回滚型 Deployment（KM-23，FR-10.4）
      description: |
        新 Deployment 携 spec.rollbackOf = 被回滚 generation，指向历史
        targetGeneration（内容代）；历史不可变。推进时逐机物化新代。
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                targetGeneration:
                  type: integer
                  format: int64
                  description: 缺省为源 Deployment 的目标代
      responses:
        "202":
          description: 回滚型 Deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/deployments/{name}/targets/{machine}/skip:
    post:
      tags: [machines]
      summary: 显式跳过被阻塞的发布目标（KM-23，FR-10.7）
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: machine
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: 已跳过（记 Skipped + 审计；不计入成功）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/skills:
    $ref: "#/components/pathItems/Skeleton"
  /api/v1/skills/{name}:
    $ref: "#/components/pathItems/Skeleton"
  /api/v1/providers:
    $ref: "#/components/pathItems/Skeleton"
  /api/v1/providers/{name}:
    $ref: "#/components/pathItems/Skeleton"
  parameters:
    ResourceName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9]([A-Za-z0-9._-]{0,251}[A-Za-z0-9])?$"
  schemas:
    EnrollTokenRequest:
      type: object
      required: [csrPubKeySha256]
      properties:
        csrPubKeySha256:
          type: string
          description: agentd 生成的 CSR 公钥指纹（enroll 输出）；token 与其绑定
          pattern: "^sha256:[0-9a-f]{64}$"
          examples: ["sha256:1f38..."]
        ttlSeconds:
          type: integer
          description: 可选有效期（秒）；默认 600（§4.6 默认 10 分钟）
    EnrollToken:
      type: object
      required: [machineId, token, expiresAt]
      properties:
        machineId:
          type: string
        token:
          type: string
          description: 一次性明文 token；仅出现一次
        expiresAt:
          type: string
          format: date-time
        note:
          type: string
  pathItems:
    Skeleton:
      get:
        tags: [skeleton]
        summary: 骨架路由（未实现）
        responses:
          "501": { $ref: "#/components/responses/Error" }
      post:
        tags: [skeleton]
        summary: 骨架路由（未实现）
        responses:
          "501": { $ref: "#/components/responses/Error" }
      put:
        tags: [skeleton]
        summary: 骨架路由（未实现）
        responses:
          "501": { $ref: "#/components/responses/Error" }
      delete:
        tags: [skeleton]
        summary: 骨架路由（未实现）
        responses:
          "501": { $ref: "#/components/responses/Error" }
  responses:
    Error:
      description: 统一错误体
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    ObjectMeta:
      type: object
      required: [name]
      properties:
        name:
          type: string
        uid:
          type: string
          description: 服务端分配，请求携带的值被忽略
        resourceVersion:
          type: integer
          format: int64
          description: 服务端管理，每次更新递增
        creationTimestamp:
          type: string
          format: date-time
    Error:
      type: object
      description: §6.4 五要素错误体（operationId 由动作类端点填充）
      required: [reason, message, timestamp]
      properties:
        reason:
          type: string
          description: 本切片取值 NotFound | AlreadyExists | Invalid | NotImplemented | Internal | MachineBusy | Unauthorized | NotReady | MethodNotAllowed
        message:
          type: string
        operationId:
          type: string
        timestamp:
          type: string
          format: date-time
        diagnostics:
          type: object
          additionalProperties:
            type: string
    Machine:
      type: object
      required: [metadata]
      properties:
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          type: object
          description: |
            Machine 规格（JSON 对象透传存储）。已知字段：
            managementMode（agentd|ssh，缺省 agentd）、profileRef、ssh。
          properties:
            managementMode:
              type: string
              enum: [agentd, ssh]
            profileRef:
              type: string
          additionalProperties: true
        status:
          type: object
          description: 控制器维护（conditions 等）；API 创建/更新时不接受改写
          additionalProperties: true
    MachineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Machine"
    AgentProfile:
      type: object
      required: [metadata]
      properties:
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          type: object
          description: AgentProfile 规格（JSON 对象透传存储）
          additionalProperties: true
        status:
          type: object
          description: 无控制器，恒为 {}
          additionalProperties: true
    AgentProfileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentProfile"
